name: Hero preview check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Inspect final video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,pix_fmt -of json 'Public/Assets/Video/Background Final Video.mp4'
      - name: Prepare browser video
        run: |
          if [ ! -f 'Public/Assets/Video/Background Final Video.web.mp4' ]; then
            ffmpeg -y -i 'Public/Assets/Video/Background Final Video.mp4' -map 0:v:0 -vf scale=1920:-2 -an -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p -movflags +faststart 'Public/Assets/Video/Background Final Video.web.mp4'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add 'Public/Assets/Video/Background Final Video.web.mp4'
            git commit -m 'Add browser compatible final background video'
            git push origin HEAD:main
          fi
      - name: Build
        run: npm run build
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify hero in browser
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/nocturne-vite.log 2>&1 &
          node .github/scripts/verify-hero.mjs
      - name: Save preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-hero-preview
          path: .github/preview/
          if-no-files-found: ignore
